<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Mappin' — 山の準備、早送りマップ（丹沢・奥多摩・秩父）</title>
  <link rel="icon" href="./logo.jpg"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { margin:0; font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; }
    #map { height:100vh; width:100%; background:#e8eef5; }
    .bar { position:absolute; z-index:1000; top:10px; left:10px; right:10px; max-width:760px;
           background:rgba(255,255,255,.96); padding:8px 12px; border-radius:10px;
           box-shadow:0 1px 4px rgba(0,0,0,.25); font-size:13px; }
    .bar h1 { font-size:15px; margin:0 0 6px; }
    .bar h1 .logo { width:22px; height:22px; border-radius:6px; vertical-align:-5px; }
    .bar h1 small { font-weight:normal; color:#555; font-size:11px; }
    .btns { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .btns button { padding:5px 10px; border:1px solid #bbb; background:#fff; border-radius:16px;
                   cursor:pointer; font-size:12px; }
    .btns button.on { background:#1a3c6e; color:#fff; border-color:#1a3c6e; }
    .btns button.act { background:#d81b60; color:#fff; border-color:#d81b60; }
    .searchrow { display:flex; gap:6px; margin-top:6px; }
    .searchrow input { flex:1; padding:5px 8px; border:1px solid #bbb; border-radius:6px; font-size:13px; }
    .searchrow button { padding:5px 10px; border:1px solid #bbb; background:#fff; border-radius:6px; cursor:pointer; }
    #cands { margin-top:4px; }
    #cands div { padding:4px 8px; background:#f0f4ff; border-radius:6px; margin-top:3px; cursor:pointer; }
    #cands div:hover { background:#dbe6ff; }
    .btns .chip { background:#eef3f8; border-color:#9db3c8; }
    .btns .chip.sel { background:#ff5722; color:#fff; border-color:#ff5722; }
    #routeInfo { margin-top:4px; font-size:12px; color:#1a3c6e; font-weight:bold; }
    /* 道路・線路・市街地を背景に沈める（色を持つのはピンとルートだけ） */
    .basemap { filter: grayscale(.85) brightness(1.07) contrast(.92); }
    .arealabel { background:rgba(255,255,255,.9); border:1px solid #1a3c6e; color:#1a3c6e;
                 border-radius:4px; padding:1px 6px; font-size:11px; font-weight:bold; box-shadow:none; }
    .arealabel::before { display:none; }
    .route-label { background:rgba(255,255,255,.88); border:1px solid #e64a19; color:#bf360c;
                   font-size:10px; font-weight:bold; padding:0 4px; box-shadow:none; }
    .route-label::before { display:none; }
    .lowzoom .route-label { display:none; }
    .pinicon span { display:flex; width:26px; height:26px; border-radius:50%; align-items:center;
      justify-content:center; font-size:14px; border:2px solid #fff;
      box-shadow:0 1px 3px rgba(0,0,0,.45); }
    .pinicon.near span { box-shadow:0 0 0 4px #ff5722, 0 1px 3px rgba(0,0,0,.45); }
    #splash { position:fixed; inset:0; z-index:2000; background:#23262d; display:flex;
      align-items:center; justify-content:center; transition:opacity .5s; }
    #splash.out { opacity:0; pointer-events:none; }
    #splash video { max-width:100%; max-height:100%; }
    #splashSkip { position:absolute; right:16px; bottom:16px; background:rgba(255,255,255,.12);
      color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:20px;
      padding:8px 18px; cursor:pointer; font-size:13px; }
    @media (max-width: 600px) {
      .bar h1 small span.tag { display:none; }  /* モバイルはタグライン非表示 */
      .btns button { min-height:44px; padding:8px 12px; }   /* タッチターゲット44px */
      .searchrow input, .searchrow button { min-height:44px; }
      /* ボタン行・ルートチップは折り返さず横スクロール（バー肥大防止） */
      .btns { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
              scrollbar-width:none; padding-bottom:2px; }
      .btns::-webkit-scrollbar { display:none; }
      .btns button { flex:0 0 auto; white-space:nowrap; }
    }
    .legend { margin-top:6px; color:#333; font-size:11px; line-height:1.9; }
    .legend .lg { white-space:nowrap; display:inline-block; margin-right:8px; }
    .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 3px 0 8px; }
    .popup b { display:block; margin-bottom:3px; }
    .popup .date { display:inline-block; background:#eee; border-radius:4px; padding:0 5px; font-size:11px; margin-bottom:3px; }
    .popup a { word-break:break-all; color:#0b57d0; }
    .postform select, .postform textarea { width:100%; margin:3px 0; font-size:13px; }
    .postform button { width:100%; padding:6px; background:#d81b60; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    #toast { position:fixed; z-index:1200; left:50%; transform:translateX(-50%); bottom:16px;
             background:#333; color:#fff; padding:8px 16px; border-radius:20px; font-size:13px; display:none; }
  </style>
</head>
<body>
<div class="bar">
  <h1><img src="./logo.jpg" alt="Mappin'" class="logo"/> Mappin' <small><span class="tag">— 危険も楽しみも1画面。登山の準備、早送り。</span><a href="../presen.html">▶ プレゼン</a></small></h1>
  <div class="btns">
    <button data-area="tanzawa" class="area on">丹沢</button>
    <button data-area="okutama" class="area">奥多摩・高尾</button>
    <button data-area="chichibu" class="area">秩父・両神山</button>
    <button id="postBtn">📍 投稿する</button>
    <button id="reloadBtn" title="みんなの投稿を再取得">🔄 更新</button>
    <button id="moreBtn" title="検索と凡例の表示切替">🔍 検索・凡例</button>
  </div>
  <div id="routeInfo"></div>
  <div id="more">
  <div class="searchrow">
    <input id="q" placeholder="住所・施設名で場所を指定（例：奥多摩駅、清川村煤ヶ谷）"/>
    <button id="qBtn">検索</button>
  </div>
  <div id="cands"></div>
  <div class="legend">
    <span class="lg">危険：<i style="background:#d32f2f"></i>人身被害<i style="background:#f57c00"></i>クマ目撃<i style="background:#fbc02d"></i>痕跡<i style="background:#7b1fa2"></i>通行止め<i style="background:#37474f"></i>公式マップ入口</span>
    <span class="lg">楽しみ：<i style="background:#2e7d32"></i>山小屋<i style="background:#1565c0"></i>展望<i style="background:#00838f"></i>食<i style="background:#607d8b"></i>🚻トイレ</span>
    <span class="lg"><i style="background:#d81b60"></i>みんなの投稿</span>
  </div>
  </div>
</div>
<div id="map"></div>
<div id="toast"></div>
<div id="splash">
  <video id="splashVideo" src="./brand.mp4" muted playsinline autoplay preload="auto"></video>
  <button id="splashSkip">スキップ ▶︎▶︎</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const POSTS_API = "https://hikemap-reports.fumi-june.workers.dev/";
const GSI_SEARCH = "https://msearch.gsi.go.jp/address-search/AddressSearch?q=";

const AREAS = {
  tanzawa:  { label: "丹沢山塊",     bounds: [[35.38, 139.02], [35.58, 139.30]] },
  okutama:  { label: "奥多摩・高尾", bounds: [[35.55, 138.93], [36.00, 139.35]] },
  chichibu: { label: "秩父・両神山", bounds: [[35.85, 138.65], [36.10, 139.20]] },
};
const COLORS = {
  attack: "#d32f2f", sighting: "#f57c00", trace: "#fbc02d", closure: "#7b1fa2", official: "#37474f",
  hut: "#2e7d32", view: "#1565c0", food: "#00838f", toilet: "#607d8b",
};
const POST_KINDS = ["目撃・危険", "景色", "食べ物", "山小屋", "困った", "その他"];
const ICONS = { attack: "🐻", sighting: "🐻", trace: "🐾", closure: "🚧", official: "🗺️",
                hut: "🏠", view: "🔭", food: "🍜", toilet: "🚻" };
const POST_ICONS = { "目撃・危険": "🐻", "景色": "📷", "食べ物": "🍜", "山小屋": "🏠", "困った": "😵", "その他": "💬" };

const $ = id => document.getElementById(id);

// ブランドスプラッシュ：再生終了/スキップ/自動再生ブロック/読込失敗のどれでも本体へ
(() => {
  const sp = $("splash"), v = $("splashVideo");
  let done = false;
  const end = () => { if (done) return; done = true; sp.classList.add("out"); setTimeout(() => sp.remove(), 600); };
  v.onended = end;
  v.onerror = end;
  $("splashSkip").onclick = end;
  v.play().catch(end);
  setTimeout(() => { if (v.readyState < 2 && !v.currentTime) end(); }, 3000);
  setTimeout(end, 15000);
})();

// モバイルは地図が主役：検索・凡例は畳んでバー占有率を下げる（🔍で開閉）
if (innerWidth < 600) $("more").style.display = "none";
$("moreBtn").onclick = () => {
  $("more").style.display = $("more").style.display === "none" ? "" : "none";
};
const map = L.map("map", { zoomControl: false });
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png", {
  attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>', maxZoom: 18,
  className: "basemap",
}).addTo(map);

// 対応エリア（MVP範囲）だけ濃く、外側は減光マスク＋破線枠で「どこを実装したか」を可視化
const outerRing = [[-85, -180], [-85, 180], [85, 180], [85, -180]];
// 穴同士が重なるとevenoddで塗りが反転するため、3エリアの合併を
// 緯度帯×マージ済み経度区間の「互いに素な矩形」に分解してから開ける
const areaHoles = (() => {
  const rects = Object.values(AREAS).map(a => a.bounds);
  const ys = [...new Set(rects.flatMap(r => [r[0][0], r[1][0]]))].sort((a, b) => a - b);
  const holes = [];
  for (let i = 0; i < ys.length - 1; i++) {
    const s = ys[i], n = ys[i + 1], mid = (s + n) / 2;
    const iv = rects.filter(r => r[0][0] <= mid && mid <= r[1][0])
      .map(r => [r[0][1], r[1][1]]).sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const [w, e] of iv) {
      if (merged.length && w <= merged[merged.length - 1][1])
        merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], e);
      else merged.push([w, e]);
    }
    for (const [w, e] of merged) holes.push([[s, w], [s, e], [n, e], [n, w]]);
  }
  return holes;
})();
L.polygon([outerRing, ...areaHoles],
  { stroke: false, fillColor: "#eef2f6", fillOpacity: .62, interactive: false }).addTo(map);
for (const a of Object.values(AREAS)) {
  L.rectangle(a.bounds, { color: "#1a3c6e", weight: 1.2, dashArray: "6 4", fill: false, interactive: false }).addTo(map);
}

const dangerLayer = L.layerGroup().addTo(map);
const funLayer = L.layerGroup().addTo(map);
const postsLayer = L.layerGroup().addTo(map);
const routesLayer = L.layerGroup().addTo(map);
L.control.layers(null, { "🥾 登山ルート": routesLayer, "⚠️ 危険（公式）": dangerLayer, "🌄 楽しみ": funLayer, "💬 みんなの投稿": postsLayer },
  { collapsed: false, position: "bottomleft" }).addTo(map);

let currentArea = "tanzawa";
let allFeatures = [];
map.fitBounds(AREAS.tanzawa.bounds);

function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2500); }

// 絵文字バッジピン（色=種別の系統、絵文字=具体的な種類。colorとiconは自前の定数のみ）
function marker(latlng, color, icon) {
  return L.marker(latlng, { icon: L.divIcon({ className: "pinicon",
    html: '<span style="background:' + color + '">' + icon + '</span>',
    iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12] }) });
}

// 静的ピン描画（XSS対策：全てDOM APIで組み立て、innerHTMLに外部文字列を入れない）
function pinPopup(p) {
  const d = document.createElement("div"); d.className = "popup";
  const b = document.createElement("b"); b.textContent = p.title; d.appendChild(b);
  if (p.date) { const s = document.createElement("span"); s.className = "date"; s.textContent = "情報日: " + p.date; d.appendChild(s); }
  const sum = document.createElement("div"); sum.textContent = p.summary || ""; d.appendChild(sum);
  if (p.source_url) { const a = document.createElement("a"); a.href = p.source_url; a.target = "_blank";
    a.rel = "noopener"; a.textContent = p.kind === "official" ? "▶ 公式マップを開く" : "▶ 公式情報ページへ"; d.appendChild(a); }
  return d;
}

const staticMarkers = [];
fetch("./pins.geojson").then(r => r.json()).then(g => {
  allFeatures = g.features || [];
  for (const f of allFeatures) {
    const p = f.properties, [lng, lat] = f.geometry.coordinates;
    const m = marker([lat, lng], COLORS[p.kind] || "#666", ICONS[p.kind] || "📍").bindPopup(pinPopup(p));
    (p.layer === "danger" ? dangerLayer : funLayer).addLayer(m);
    staticMarkers.push({ m, lat, lng, p });
  }
}).catch(() => toast("ピンデータの読み込みに失敗（地図は使えます）"));

// ---- 登山ルート：選ぶと「自分に関与する情報」だけ浮かび上がる ----
const NEAR_M = 500;
let routes = [], selectedRoute = null;
function segsOf(geom) {
  const segs = [];
  for (const line of geom.coordinates)
    for (let i = 1; i < line.length; i++)
      segs.push([line[i - 1][1], line[i - 1][0], line[i][1], line[i][0]]);
  return segs;
}
function pinDistM(lat, lng, segs) {
  const KX = 111320 * Math.cos(lat * Math.PI / 180), KY = 110540;
  let best = Infinity;
  for (const [aLat, aLng, bLat, bLng] of segs) {
    const ax = (aLng - lng) * KX, ay = (aLat - lat) * KY, bx = (bLng - lng) * KX, by = (bLat - lat) * KY;
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let t = l2 ? -(ax * dx + ay * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(ax + t * dx, ay + t * dy);
    if (d < best) best = d;
  }
  return best;
}
fetch("./routes.geojson").then(r => r.json()).then(g => {
  for (const f of (g.features || [])) {
    const rec = { name: f.properties.name, area: f.properties.area, segs: segsOf(f.geometry) };
    rec.line = L.geoJSON(f, { style: { color: "#e64a19", weight: 4, opacity: .9 } })
      .bindTooltip(rec.name, { sticky: true })
      .on("click", () => { if (currentArea !== rec.area) setArea(rec.area, false); selectRoute(rec); });
    routesLayer.addLayer(rec.line);
    routes.push(rec);
    // 登山道名ラベル（最長区間の中間点。ズーム11未満では非表示にしてクラッタ回避）
    const longest = f.geometry.coordinates.reduce((a, b) => b.length > a.length ? b : a);
    const mid = longest[Math.floor(longest.length / 2)];
    routesLayer.addLayer(L.tooltip({ permanent: true, direction: "top", className: "route-label" })
      .setLatLng([mid[1], mid[0]]).setContent(rec.name));
  }
  gateLabels();
}).catch(() => {});
const gateLabels = () => map.getContainer().classList.toggle("lowzoom", map.getZoom() < 11);
map.on("zoomend", gateLabels);
function selectRoute(r) {
  selectedRoute = (r === selectedRoute) ? null : r;
  // 全ルート常時・濃いオレンジ（ユーザー指定）。選択の区別は太さのみ
  for (const q of routes) q.line.setStyle({
    color: "#e64a19",
    weight: q === selectedRoute ? 7 : 4,
    opacity: .9,
  });
  applyRelevance();
}
function applyRelevance() {
  let cd = 0, cf = 0, cp = 0;
  const mark = (rec, isPost) => {
    // 全ピン常時フル表示（ユーザー指定：濃いまま）。関与は沿線ピンのオレンジ縁取りで示す
    let near = false;
    if (selectedRoute) near = pinDistM(rec.lat, rec.lng, selectedRoute.segs) <= NEAR_M;
    const el = rec.m.getElement();
    if (el) el.classList.toggle("near", !!(selectedRoute && near));
    if (near) { if (isPost) cp++; else if (rec.p.layer === "danger") cd++; else cf++; }
  };
  staticMarkers.forEach(r => mark(r, false));
  postMarkers.forEach(r => mark(r, true));
  $("routeInfo").textContent = selectedRoute
    ? `🥾 ${selectedRoute.name} 沿い${NEAR_M}m：⚠️危険${cd}件・🌄楽しみ${cf}件・💬投稿${cp}件（大きいピン＝ルート沿い）`
    : "";
}
// ルート選択チップは廃止（ユーザー指定：ルートは常時表示、選択UIは不要。
// 地図上のルート線タップでのみ沿線情報とAIカード絞りが働く）

// ---- みんなの投稿（更新は 初回 / 自分の投稿直後 / 手動🔄 のみ。ポーリングなし） ----
function postPopup(p) {
  const d = document.createElement("div"); d.className = "popup";
  const b = document.createElement("b"); b.textContent = "💬 " + p.kind; d.appendChild(b);
  const s = document.createElement("span"); s.className = "date";
  s.textContent = new Date(p.ts).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  d.appendChild(s);
  const t = document.createElement("div"); t.textContent = p.text; d.appendChild(t);
  return d;
}
const postMarkers = [];
async function loadPosts() {
  try {
    const posts = await (await fetch(POSTS_API)).json();
    postsLayer.clearLayers(); postMarkers.length = 0;
    for (const p of posts) {
      const m = marker([p.lat, p.lng], "#d81b60", POST_ICONS[p.kind] || "💬").bindPopup(postPopup(p));
      postsLayer.addLayer(m); postMarkers.push({ m, lat: p.lat, lng: p.lng, p });
    }
    if (selectedRoute) applyRelevance();
    return posts.length;
  } catch { toast("投稿の取得に失敗"); return -1; }
}
loadPosts();
$("reloadBtn").onclick = async () => { const n = await loadPosts(); if (n >= 0) toast(`更新しました（投稿 ${n} 件）`); };

// ---- 投稿フォーム（地図クリック / 検索結果の地点） ----
let postMode = false;
$("postBtn").onclick = () => {
  postMode = !postMode;
  $("postBtn").classList.toggle("act", postMode);
  toast(postMode ? "地図をタップして投稿地点を指定" : "投稿モード終了");
};
map.on("click", e => { if (postMode) openPostForm(e.latlng); });

function openPostForm(latlng) {
  const d = document.createElement("div"); d.className = "postform";
  const b = document.createElement("b"); b.textContent = "この地点にコメントを投稿"; d.appendChild(b);
  const sel = document.createElement("select");
  for (const k of POST_KINDS) { const o = document.createElement("option"); o.value = o.textContent = k; sel.appendChild(o); }
  d.appendChild(sel);
  const ta = document.createElement("textarea"); ta.rows = 3; ta.maxLength = 140;
  ta.placeholder = "140字まで（例：この先の水場付近で足跡を見た／茶屋のなめこ汁が最高）"; d.appendChild(ta);
  const btn = document.createElement("button"); btn.textContent = "投稿する"; d.appendChild(btn);
  const pop = L.popup().setLatLng(latlng).setContent(d).openOn(map);
  btn.onclick = async () => {
    const text = ta.value.trim();
    if (!text) { toast("コメントを入力してください"); return; }
    btn.disabled = true; btn.textContent = "送信中…";
    try {
      const r = await fetch(POSTS_API, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lat: latlng.lat, lng: latlng.lng, kind: sel.value, text }) });
      if (!r.ok) throw 0;
      map.closePopup(pop); postMode = false; $("postBtn").classList.remove("act");
      await loadPosts(); toast("投稿しました！");
    } catch { btn.disabled = false; btn.textContent = "投稿する"; toast("投稿に失敗しました"); }
  };
}

// ---- 住所・施設名検索（国土地理院ジオコーダ、キー不要・CORS確認済み） ----
$("qBtn").onclick = doSearch;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
async function doSearch() {
  const q = $("q").value.trim(); if (!q) return;
  $("cands").textContent = "検索中…";
  try {
    const res = await (await fetch(GSI_SEARCH + encodeURIComponent(q))).json();
    $("cands").textContent = "";
    if (!res.length) { $("cands").textContent = "見つかりません——地図を直接タップでも投稿できます"; return; }
    for (const c of res.slice(0, 5)) {
      const [lng, lat] = c.geometry.coordinates;
      const div = document.createElement("div"); div.textContent = "📍 " + c.properties.title;
      div.onclick = () => { $("cands").textContent = ""; map.flyTo([lat, lng], 14);
        setTimeout(() => openPostForm(L.latLng(lat, lng)), 600); };
      $("cands").appendChild(div);
    }
  } catch { $("cands").textContent = "検索に失敗——地図を直接タップでも投稿できます"; }
}

// ---- 山域切替 ----
function setArea(area, fly = true) {
  currentArea = area;
  document.querySelectorAll(".area").forEach(b => b.classList.toggle("on", b.dataset.area === area));
  if (fly) map.flyToBounds(AREAS[area].bounds);
  if (selectedRoute && selectedRoute.area !== area) selectRoute(selectedRoute); // 解除
}
for (const btn of document.querySelectorAll(".area")) btn.onclick = () => setArea(btn.dataset.area);
